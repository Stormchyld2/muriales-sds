<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muriale's SDS Manager</title>
<link rel="icon" type="image/png" sizes="256x256" href="app-icon.png?v=2">
<style>
:root{--bg:#2c2e33;--panel:#35383e;--panel2:#3d4047;--line:#565a62;--text:#f1f1f1;--mute:#b9bcc2;
  --wine:#8a1626;--wine2:#5b0c17;--gold:#e0bc6e;--green:#1e7d30;--green2:#145a22;--cream:#f6f1e6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",Tahoma,Arial,sans-serif;display:flex;overflow:hidden}
button,input,select,textarea{font:inherit}
aside{width:176px;flex:none;background:linear-gradient(#25272b,#1f2125);border-right:1px solid #45484f;display:flex;flex-direction:column;padding:12px 8px}
aside img{width:150px;margin:2px auto 16px;display:block}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:2px 0;border-radius:6px;color:var(--text);background:none;border:0;cursor:pointer;text-align:left;font-size:14.5px;width:100%}
.nav:hover{background:#3a3d43}
.nav.on{background:linear-gradient(#2f72bd,#1d4b82);box-shadow:inset 0 0 0 1px #7db0ea66}
.nav svg,.btn svg{width:18px;height:18px;flex:none}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:12px 20px 10px}
header h1{font:700 27px Georgia,"Times New Roman",serif;margin:0;letter-spacing:.2px}
header p{margin:1px 0 0;font-size:15px;color:#e4e4e4}
.pictos{margin-left:auto;display:flex;gap:10px}
.pictos svg{width:44px;height:44px}
.flag{height:3px;background:linear-gradient(90deg,transparent,#1f8a3b 15%,#f4f4f4 50%,#c8202f 85%,transparent)}
#view{flex:1;min-height:0;padding:14px 20px 16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;border-radius:6px;border:1px solid #6b6f78;background:linear-gradient(#4a4d55,#3a3d44);color:var(--text);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.2)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.green{background:linear-gradient(var(--green),var(--green2));border-color:#3aa24e}
.btn.wine{background:linear-gradient(var(--wine),var(--wine2));border-color:#b23a4a}
.btn.big{padding:10px 22px;font-size:15px}
.btn.small{padding:5px 10px;font-weight:500;font-size:13px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.field{background:#24262a;border:1px solid #6b6f78;border-radius:5px;color:var(--text);padding:7px 10px;width:100%}
.field:focus{outline:2px solid var(--gold);outline-offset:0}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:10px;top:9px;width:17px;height:17px;color:#bbb}
.search input{padding-left:34px}
.tablewrap{flex:1;min-height:160px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:#3f4249;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
th.nosort{cursor:default;width:38px}
th .arr{color:var(--gold);font-size:11px;margin-left:4px}
td{padding:8px 10px;border-bottom:1px solid #45484f}
tbody tr{cursor:pointer}
tbody tr:hover{background:#40434a}
tbody tr.sel{background:linear-gradient(#7d1423,#5b0c17)}
input[type=checkbox]{width:16px;height:16px;accent-color:#c8a04e;cursor:pointer}
.tag{font-size:11.5px;border:1px solid #a8862f;color:var(--gold);border-radius:10px;padding:1px 8px;margin-left:8px;white-space:nowrap}
.empty{padding:48px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.bar{background:linear-gradient(var(--wine),var(--wine2));border-radius:5px;padding:7px 14px;font:700 21px "Segoe UI",sans-serif}
.detail{flex:1;min-height:0;display:grid;grid-template-columns:minmax(360px,5fr) 6fr;gap:12px}
.detail .left{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.detail iframe{width:100%;height:100%;min-height:340px;border:1px solid var(--line);border-radius:6px;background:#fff}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0}
dt{font-weight:600}dd{margin:0}
.poison{background:linear-gradient(#c01f30,#8a1626);border:1px solid #e25a68;border-radius:6px;padding:10px 18px;text-align:center;font-weight:700}
.poison span{display:block;font-size:14px;font-weight:600}
.poison strong{font-size:22px;letter-spacing:.5px}
.sum h3{margin:0 0 2px;font-size:14.5px}
.sum .blk{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #4a4d55}
.sum .blk:last-child{border:0}
.sum svg{width:34px;height:34px;flex:none}
.sum p{margin:0;white-space:pre-wrap}
.sum .none{color:var(--mute);font-style:italic}
.form{display:grid;grid-template-columns:230px 1fr;gap:16px;flex:none}
.scrolly{max-height:300px;overflow:auto}
.stickybar{position:sticky;bottom:-16px;background:var(--bg);padding:8px 0;flex:none;z-index:2}
.drop{border:2px dashed #999;border-radius:8px;padding:18px 12px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:190px}
.drop.over{border-color:var(--gold);background:#3d3a30}
.drop svg{width:44px;height:44px}
.drop small{color:var(--mute)}
.drop .file{color:var(--gold);font-weight:600;word-break:break-word}
.fields{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;align-items:center}
.fields label{font-weight:600}
.fields textarea{resize:vertical;min-height:36px}
.req{color:#ff6b6b}
.sect{border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;flex:1 1 200px;min-height:150px}
.sect>h2{margin:0;padding:6px 12px;font-size:15px;background:linear-gradient(var(--wine),var(--wine2))}
.sect>h2{flex:none}
.sect>div{padding:12px;overflow:auto;flex:1;min-height:0}
.hint{color:var(--mute);font-size:13px}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20}
#modal.show{display:flex}
.dialog{background:var(--cream);color:#1b1b1b;border-radius:8px;width:min(560px,92vw);overflow:hidden;box-shadow:0 20px 60px #000}
.dialog h2{margin:0;padding:12px 18px;font-size:21px;color:#fff;background:linear-gradient(var(--wine),var(--wine2));display:flex;gap:12px;align-items:center}
.dialog h2 svg{width:28px;height:28px}
.dialog .body{padding:16px 20px}
.dialog .foot{display:flex;gap:14px;justify-content:center;padding:4px 20px 20px}
.dialog .box{background:#f3dfb0;border:1px solid #d9b56a;border-radius:6px;padding:10px 14px;margin:12px 0}
.dialog .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.dialog label{display:flex;gap:9px;align-items:center;padding:4px 0;cursor:pointer}
.dialog label.off{opacity:.45;cursor:default}
.dialog input[type=radio]{width:16px;height:16px;accent-color:var(--wine)}
.dialog input[type=checkbox]{accent-color:var(--green)}
.dialog .field{background:#fff;color:#111}
.dialog h4{margin:0 0 6px}
#preview{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:30}
#preview.show{display:flex}
#preview .top{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
#preview iframe{flex:1;border:0;background:#fff}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#1f2125;border:1px solid var(--gold);padding:10px 18px;border-radius:6px;display:none;z-index:40;max-width:80vw}
#toast.err{border-color:#e25a68;background:#3a0d14}
#lost{position:fixed;top:0;left:0;right:0;background:#c01f30;padding:10px;text-align:center;font-weight:600;display:none;z-index:50}
.catrow{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid #4a4d55}
.catrow .btn{flex:none}
.tag.red{border-color:#e25a68;color:#ff9aa5}.tag.blue{border-color:#6aa5e8;color:#a9cdf5}
.note{border-radius:6px;padding:9px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid}
.note.ok{background:#1f3a26;border-color:#3aa24e}.note.warn{background:#473a17;border-color:#d9b56a}.note.bad{background:#4a1820;border-color:#e25a68}
.note .grow{min-width:260px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:8px 16px;cursor:pointer;font-weight:600;font-size:15px}
.tabs button.on{color:var(--text);border-bottom-color:var(--gold)}
.picgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.picgrid label{display:flex;gap:8px;align-items:center;font-weight:400;border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer}
.picgrid svg{width:34px;height:34px;flex:none}
.pictos figure{margin:0;text-align:center;font-size:11px;line-height:1.2;max-width:76px}
.signal{align-self:center;font-weight:800;letter-spacing:1px;padding:5px 12px;border-radius:5px;font-size:15px}
.signal.Danger{background:#c8202f;color:#fff}.signal.Warning{background:#e7b416;color:#111}
.plain td{cursor:default}.plain tbody tr{cursor:default}.plain tbody tr:hover{background:none}
code{background:#1f2125;border:1px solid #565a62;border-radius:4px;padding:2px 6px;word-break:break-all}
/* small or reduced windows: wrap and scroll instead of running off the edge */
aside{overflow-y:auto;min-height:0}header{flex-wrap:wrap}.acts{flex-wrap:wrap}.dialog .foot{flex-wrap:wrap}.dialog .body,.catrow{min-width:0}.catrow{flex-wrap:wrap}.tablewrap,.panel{max-width:100%}
@media (max-width:1100px){aside{width:150px}aside img{width:120px}.nav{padding:8px 9px;font-size:13.5px}#view{padding:12px}header{padding:10px 12px 8px;gap:10px}header h1{font-size:22px}.pictos svg{width:34px;height:34px}}
@media (max-width:820px){aside{width:128px}aside img{width:96px}.nav{padding:7px 8px;font-size:13px;gap:6px}.pictos{display:none}header p{font-size:13px}}
/* no visible scroll bars: scroll with the wheel or a finger */
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{width:0;height:0;display:none}
</style>
</head>
<body>
<aside>
  <img src="logo.png" alt="Muriale's Italian Kitchen">
  <nav id="nav"></nav>
</aside>
<main>
  <header>
    <div><h1>Muriale's SDS Manager</h1><p id="subtitle"></p></div>
    <div class="pictos" id="pictos"></div>
  </header>
  <div class="flag"></div>
  <section id="view"></section>
</main>
<div id="modal"></div>
<div id="preview">
  <div class="top">
    <strong id="pvTitle" class="grow"></strong>
    <span id="pvNote" class="hint"></span>
    <button class="btn green" data-act="pv-print"></button>
    <button class="btn" data-act="pv-save"></button>
    <button class="btn wine" data-act="pv-close"></button>
  </div>
  <iframe id="pvFrame" title="Print preview"></iframe>
</div>
<div id="toast"></div>
<div id="lost">Muriale's SDS Manager has stopped. Close this window and open the program again.</div>

<script src="pdf-lib.min.js"></script>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
function emailResult(o, what) {
  if (o.method === "outlook") return toast("The message is open in Outlook with the " + what + " attached. If you do not see it, check behind this window or on the taskbar, then press Send.");
  try { navigator.clipboard.writeText(o.text || ""); } catch (e) {}
  showModal(`<h2>${icon("ext")}Finish the email</h2><div class="body"><p style="margin-top:0">Outlook could not be opened automatically${o.detail ? ` (<span class="hint">${esc(o.detail)}</span>)` : ""}. A new message was opened in your default mail program and the folder holding the ${esc(what)} was opened.</p>
    <p>Attach <b>${esc(o.file)}</b> from that folder. The message text was copied, so you can also paste it into any email.</p>
    <p class="hint">If no mail window opened, your computer has no mail program set up for links. Open Outlook yourself, start a new message, paste the text below and attach the file.</p>
    <textarea class="field" rows="6" readonly onclick="this.select()">${esc(o.text || "")}</textarea></div><div class="foot"><button class="btn big" data-act="close">Close</button></div>`);
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const ICON = {
  home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  add:'<path d="M6 2h9l5 5v15H6z"/><path d="M12 11v7M8.5 14.5h7"/>',

  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',

  folder:'<path d="M3 6h7l2 2h9v11H3z"/>',
  down:'<path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>',
};
const icon = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
const diamond = inner => `<svg viewBox="0 0 48 48"><path d="M24 2 46 24 24 46 2 24z" fill="#fff" stroke="#d81e2c" stroke-width="3.5" stroke-linejoin="round"/>${inner}</svg>`;
const PICTO = {
  flame: diamond('<path d="M24 12c1 5 7 7 7 14a7 7 0 0 1-14 0c0-3 1.500-5 3-6 0 2 1 3 2 3 1-3 0-7 2-11z" fill="#111"/><path d="M15 36h18" stroke="#111" stroke-width="2.500"/>'),
  oxidizer: diamond('<path d="M24 9c.7 3.500 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.500 2-4.200 0 1.400.7 2 1.400 2 .7-2 0-5 1.600-7.800z" fill="#111"/><circle cx="24" cy="31" r="6" fill="none" stroke="#111" stroke-width="2.600"/><path d="M14 39h20" stroke="#111" stroke-width="2.500"/>'),
  explosive: diamond('<path d="M24 12l2.500 7 6-4.500-2.500 7 7.500.500-6 4.500 5 5.500-7.500-1.500L28 38l-4-6-4 6-1-7.500-7.500 1.500 5-5.500-6-4.500 7.500-.500-2.500-7 6 4.500z" fill="#111"/>'),
  corrosive: diamond('<path d="M14 13l9 3-2 6-9-3zM34 13l-9 3 2 6 9-3z" fill="#111"/><path d="M20 24c1.200 2 2 3 2 4.200a2 2 0 0 1-4 0c0-1.200.8-2.200 2-4.200zM29 24c1.200 2 2 3 2 4.200a2 2 0 0 1-4 0c0-1.200.8-2.200 2-4.200z" fill="#111"/><path d="M11 35h9l2-2.500 2 2.500h13" stroke="#111" stroke-width="3" fill="none"/>'),
  gas: diamond('<g transform="rotate(-35 24 24)"><rect x="12" y="19" width="22" height="10" rx="5" fill="#111"/><rect x="34" y="22" width="5" height="4" fill="#111"/></g>'),
  skull: diamond('<path d="M24 11a9 9 0 0 0-9 9c0 3 1.400 5 3.500 6.500V30h11v-3.500C31.600 25 33 23 33 20a9 9 0 0 0-9-9z" fill="#111"/><circle cx="20.500" cy="20" r="2.300" fill="#fff"/><circle cx="27.500" cy="20" r="2.300" fill="#fff"/><path d="M15 32l18 6M33 32l-18 6" stroke="#111" stroke-width="2.600" stroke-linecap="round"/>'),
  bang: diamond('<path d="M24 11c2 0 3 1.500 3 3l-1.700 13h-2.600L21 14c0-1.500 1-3 3-3z" fill="#111"/><circle cx="24" cy="33" r="3" fill="#111"/>'),
  health: diamond('<circle cx="24" cy="15" r="4.500" fill="#111"/><path d="M13 38c0-9 4-16 11-16s11 7 11 16z" fill="#111"/><path d="M24 24.500l1.300 3 3.200-.600-2 2.600 2 2.600-3.200-.600-1.300 3-1.300-3-3.200.600 2-2.600-2-2.600 3.200.600z" fill="#fff"/>'),
  environment: diamond('<path d="M17 33V20M17 25l-4-4M17 23l4-4M17 20l-2-4M17 20l2-4" stroke="#111" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M22 33c3-4 9-4 12 0-3 3.500-9 3.500-12 0zM34 33l3-2.500v5z" fill="#111"/><path d="M11 37h26" stroke="#111" stroke-width="2"/>'),
  cross: '<svg viewBox="0 0 48 48"><rect x="3" y="3" width="42" height="42" rx="5" fill="#c8202f"/><path d="M24 11v26M11 24h26" stroke="#fff" stroke-width="8"/></svg>',
  ppe: '<svg viewBox="0 0 48 48" fill="none" stroke="#e0bc6e" stroke-width="3"><rect x="4" y="16" width="17" height="14" rx="6"/><rect x="27" y="16" width="17" height="14" rx="6"/><path d="M21 22h6"/></svg>',
};
// The nine GHS hazard pictograms, in the order they are offered on the form.
const GHS = [["flame","Flammable"],["oxidizer","Oxidizer"],["explosive","Explosive"],["corrosive","Corrosive"],["gas","Gas under pressure"],["skull","Acute toxicity"],["bang","Irritant / harmful"],["health","Health hazard"],["environment","Environmental hazard"]];
const pictosOf = p => GHS.filter(([k]) => (p.pictograms || []).includes(k));


const CAT_HELP = {
  "Dish Machine": "Machine detergents, rinse aids, delimers, machine descalers",
  "Sanitizers & Disinfectants": "Quaternary ammonium sanitizers, chlorine sanitizers, disinfectants",
  "Degreasers": "Heavy-duty degreasers, grill cleaners, oven cleaners, fryer cleaners",
  "General Cleaning": "All-purpose cleaners, surface cleaners, glass cleaners",
  "Floor Care": "Floor cleaners, floor degreasers, strippers, floor finishes",
  "Restroom Cleaning": "Toilet bowl cleaners, urinal cleaners, bathroom disinfectants",
  "Laundry": "Laundry detergents, bleach, fabric softeners, stain removers",
  "Drain Maintenance": "Drain openers, drain cleaners, chemical drain treatments",
  "Descalers & Delimers": "Lime removers, mineral deposit removers, equipment descalers",
  "Pest Control": "Insecticides, pesticides, rodent-control chemicals",
  "Hand Hygiene": "Hand soaps, hand sanitizers, specialty hand cleaners",
  "Maintenance Chemicals": "Lubricants, adhesives, solvents, equipment maintenance chemicals",
  "Air Care & Deodorizers": "Air fresheners, odor neutralizers, deodorizing chemicals",
  "Other / Miscellaneous": "Chemicals that don't fit an established category",
};
const state = { tab: "storage", backups: null, lock: null, rec: null, diag: null, integ: null, lib: {categories: [], locations: [], catchAll: "Other / Miscellaneous", products: [], removed: [], binder: null, dataFolder: ""}, sel: new Set(), q: "", cat: "", sort: {key: "name", dir: 1}, view: "library", id: null, form: null };

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong. Please try again.");
  return j;
}
async function reload() {
  state.lib = await api("/api/library");
  const ids = new Set(state.lib.products.map(p => p.id));
  for (const id of [...state.sel]) if (!ids.has(id)) state.sel.delete(id);
}
let toastT;
function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg; t.className = err ? "err" : ""; t.style.display = "block";
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = "none", err ? 7000 : 3500);
}
const fmtDate = d => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(d || ""); return m ? `${m[2]}/${m[3]}/${m[1]}` : ""; };
// The SDS date is the manufacturer's revision date and nothing else. The day a
// manager last edited the product is a different thing and is never shown in its place.
const sdsDate = p => fmtDate(p.revisionDate) || "Unknown";
const hasSummary = p => [p.hazards, p.firstAidEyes, p.firstAidSkin, p.firstAidInhalation, p.firstAidSwallowed, p.ppe, p.signalWord].some(v => (v || "").trim()) || (p.pictograms || []).length > 0;
// Where the emergency summary stands: missing, typed in but never checked,
// checked but the PDF has since been replaced, or verified.
function summaryState(p) {
  if (!hasSummary(p)) return {k: "none", tag: "summary missing", cls: ""};
  if (p.summaryNeedsCheck) return {k: "recheck", tag: "summary needs re-check", cls: "red"};
  if (!p.summaryVerifiedAt) return {k: "unverified", tag: "summary not verified", cls: ""};
  return {k: "ok"};
}
// What has changed in the library since the paper binder was last recorded as up to date.
function binderDiff() {
  const b = state.lib.binder; if (!b) return null;
  const items = b.items || {}, live = state.lib.products, d = {add: [], replace: [], pull: [], index: false};
  for (const p of live) {
    const was = items[p.id];
    if (!was) d.add.push(p);
    else if (was.pdfUpdatedAt !== p.pdfUpdatedAt) d.replace.push(p);
    else if (["name", "manufacturer", "category", "location", "revisionDate"].some(k => (was[k] || "") !== (p[k] || ""))) d.index = true;
  }
  for (const id in items) if (!live.some(p => p.id === id)) d.pull.push(items[id].name);
  d.any = d.add.length + d.replace.length + d.pull.length > 0 || d.index;
  return d;
}
const byId = id => state.lib.products.find(p => p.id === id);
const longDate = () => new Date().toLocaleDateString("en-US", {year: "numeric", month: "long", day: "numeric"});

function visible() {
  const q = state.q.trim().toLowerCase();
  const k = state.sort.key;
  const val = p => (k === "date" ? p.revisionDate || "" : p[k] || "").toLowerCase();
  return state.lib.products
    .filter(p => (!state.cat || p.category === state.cat) && (!q || [p.name, p.aliases, p.manufacturer, p.supplier, p.tags].join(" ").toLowerCase().includes(q)))
    .sort((a, b) => val(a).localeCompare(val(b)) * state.sort.dir || a.name.localeCompare(b.name));
}

  $("#subtitle").textContent = state.view === "add" && state.form && state.form.replaceMode ? "Replace SDS PDF" : SUB[state.view];
  const shown = state.view === "detail" && byId(state.id);
  $("#pictos").innerHTML = !shown ? "" : (shown.signalWord ? `<span class="signal ${esc(shown.signalWord)}">${esc(shown.signalWord.toUpperCase())}</span>` : "")
    + pictosOf(shown).map(([k, label]) => `<figure title="${label}">${PICTO[k]}<figcaption>${label}</figcaption></figure>`).join("");
  $("#view").innerHTML = lockBanner() + ({library: vLibrary, detail: vDetail, add: vForm, categories: vCats, notes: vNotes, settings: vSettings, about: vAbout}[state.view])();

}

function binderNote() {
  if (!state.lib.products.length && !state.lib.binder) return "";
  const d = binderDiff(), names = a => a.map(p => esc(p.name || p)).join(", ");
  const lb = state.lib.lastBuild, can = lb && lb.complete && !lb.confirmed;
  const confirm = can ? `<button class="btn small" data-act="binder-mark">Confirm Binder Updated...</button>` : "";
  const made = !lb || lb.confirmed ? "" : lb.complete
    ? ` A complete ${lb.scope === "all" ? "book" : lb.scope === "index" ? "index" : "set of sheets"} was assembled ${fmtDate(lb.at)} (${lb.pages} pages). Once it is printed and in the binder, confirm it.`
    : ` <b>The last book assembled (${fmtDate(lb.at)}) was incomplete</b>${(lb.missing || []).length ? ", missing: " + esc(lb.missing.join(", ")) : ""}. Fix those sheets and print again.`;
  if (!d) return `<div class="note warn"><span class="grow"><b>Paper binder:</b> not recorded yet. Print the entire book and put it in the binder.${made}</span>${confirm}</div>`;
  const when = fmtDate(state.lib.binder.updatedAt), pages = state.lib.binder.pages;
  if (!d.any) return `<div class="note ok"><span class="grow"><b>Paper binder is up to date.</b> Confirmed by a manager ${when}${pages ? `, ${pages} pages` : ""}.</span></div>`;
  const parts = [];
  if (d.add.length) parts.push(`<b>Add:</b> ${names(d.add)}`);
  if (d.replace.length) parts.push(`<b>Replace:</b> ${names(d.replace)}`);
  if (d.pull.length) parts.push(`<b>Take out:</b> ${names(d.pull)}`);
  if (d.index || d.add.length || d.pull.length) parts.push("<b>Reprint the index.</b>");
  return `<div class="note warn"><span class="grow"><b>Paper binder is out of date</b> (last confirmed ${when}). ${parts.join(" &nbsp;·&nbsp; ")}${made}</span>
    ${d.add.length + d.replace.length ? `<button class="btn small" data-act="binder-select">Select Sheets to Print</button>` : ""}${d.pull.length ? `<button class="btn small" data-act="binder-pulled">Sheets Taken Out</button>` : ""}${confirm}</div>`;
}

      </div>
      ${p.needsReview ? `<div class="note warn"><span class="grow"><b>Needs review.</b> This PDF was added without a manager's check. Any details shown were drafted from the sheet. Click Edit, check them against the PDF, and add the category and storage location.</span></div>` : ""}
      ${p.missing ? `<div class="note bad"><span class="grow"><b>The PDF for this product is missing from the sheets folder.</b> Use Replace to add it again, or Remove if the product is no longer used.</span><button class="btn small" data-act="replace" data-id="${p.id}">Replace PDF</button><button class="btn small wine" data-act="remove" data-id="${p.id}">Remove</button></div>` : ""}
      ${(state.lib.integrity || {})[p.id] === "changed" ? `<div class="note bad"><span class="grow"><b>This PDF is not the file that was added.</b> It was changed outside the program. Open it and check it. If it is the right sheet, accept it; the binder will then show this sheet as needing a reprint.</span><button class="btn small" data-act="integ-accept" data-id="${p.id}">Accept This File</button></div>` : ""}
      ${verify}
      <div class="panel sum">
        <div class="blk">${PICTO.bang}<div><h3>Hazard Warnings${p.signalWord ? " — " + esc(p.signalWord.toUpperCase()) : ""}</h3>${pics ? `<p><b>Pictograms on the SDS:</b> ${pics}</p>` : ""}${(p.hazards || "").trim() ? `<p>${esc(p.hazards)}</p>` : pics || p.signalWord ? "" : none}</div></div>

const TABS = [["storage","Library Folder"],["areas","Storage Areas"],["backup","Backup &amp; Restore"],["transfer","Import &amp; Export"],["cleanup","Clean Up"],["recovery","Recovery"],["diagnostics","Diagnostics"]];
function loadTab() { if (state.view !== "settings") return; const f = {backup: loadBackups, recovery: loadRecovery, diagnostics: loadDiag}[state.tab]; if (f) f(); }
async function loadBackups() { state.backups = await api("/api/backups"); if (state.view === "settings") render(); }
async function loadRecovery() { state.rec = await api("/api/recovery"); if (state.view === "settings" && state.tab === "recovery") render(); }
async function loadDiag() { state.diag = await api("/api/diagnostics"); if (state.view === "settings" && state.tab === "diagnostics") render(); }
function vSettings() {
  const tabs = `<div class="tabs">${TABS.map(([k, l]) => `<button class="${state.tab === k ? "on" : ""}" data-act="tab" data-t="${k}">${l}</button>`).join("")}</div>`;
  const body = ({storage: tStorage, areas: tAreas, backup: tBackup, transfer: tTransfer, cleanup: tCleanup, recovery: tRecovery, diagnostics: tDiag}[state.tab] || tStorage)();
  return tabs + body;
}

  const box = (k, label, off) => `<label class="${off ? "off" : ""}"><input type="checkbox" data-o="${k}" ${o[k] || off === "on" ? "checked" : ""} ${off ? "disabled" : ""}>${label}</label>`;
  showModal(`<h2>${icon("print")}Print SDS Book</h2><div class="body">
    <div class="cols"><div><h4>What Would You Like to Print?</h4>
      ${radio("all", `Entire Book (all ${state.lib.products.length} SDS sheets)`)}
      ${radio("selected", `Selected Sheets Only (${state.sel.size} product${state.sel.size === 1 ? "" : "s"})`, !state.sel.size)}
      ${radio("index", "Index Only")}</div>
    <div><h4>${idxOnly ? "The Book the Index Is For" : "Include in Printout"}</h4>
      ${box("cover", "Cover Page (Muriale's Logo)")}${box("index", "Index of Chemicals", idxOnly ? "on" : "")}${box("dividers", "Category Divider Pages")}${box("numbers", "Add Binder Page Numbers (shrinks each page 3%)")}${box("eco", "Printer-friendly (saves ink)")}</div></div>
    <div class="box"><b>Print Summary</b><br>Products: ${e.n} &nbsp;&nbsp;&nbsp; Estimated Pages: ${e.unknown ? "at least " : ""}${e.pages}
      <br><span style="font-size:13px">${idxOnly ? "Index pages only. Its page references match a book printed with the options ticked above." : o.numbers ? "Each page gets a binder page number in a strip at the bottom. Manufacturer pages are shrunk about 3% to make room, so the number never covers anything on the sheet." : "The manufacturer's pages are copied exactly as they are, with nothing added to them. The index lists the page each SDS starts on, counting every page of the book."}
      The exact page count is confirmed on the preview before anything prints.</span></div>
    <p id="busy" style="margin:0;min-height:20px;font-weight:600"></p></div>
    <div class="foot"><button class="btn green big" data-act="print-go" ${e.n ? "" : "disabled"}>${icon("print")}Preview &amp; Print</button><button class="btn big" data-act="close">${icon("x")}Cancel</button></div>`);
}

/* ---------- building the printed book ---------- */
const {PDFDocument, StandardFonts, rgb, degrees} = PDFLib;
const WINE = rgb(0.48, 0.07, 0.13), GOLD = rgb(0.72, 0.56, 0.22), INK = rgb(0.1, 0.1, 0.1), GREY = rgb(0.35, 0.35, 0.35), RED = rgb(0.78, 0.05, 0.1);
// The built-in PDF fonts only hold basic Latin characters, so anything else is swapped out.
const BAND = 22;
const rotOf = pg => ((pg.getRotation().angle % 360) + 360) % 360;
const clean = s => String(s ?? "").replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, "-").replace(/®|™/g, "").replace(/\s+/g, " ").replace(/[^\x20-\x7E\xA1-\xFF]/g, "?").trim();
function fit(text, font, size, max) {
  let t = clean(text);
  if (font.widthOfTextAtSize(t, size) <= max) return t;
  while (t.length > 1 && font.widthOfTextAtSize(t + "...", size) > max) t = t.slice(0, -1);
  return t.trimEnd() + "...";
}
const centre = (page, text, font, size, y, color = INK) => page.drawText(text, {x: (page.getWidth() - font.widthOfTextAtSize(text, size)) / 2, y, size, font, color});

// loadSheet fetches one product's PDF and says plainly why it cannot be used, if it cannot.
async function loadSheet(p) {
  let bytes;
  try { const r = await fetch("/pdf/" + p.id); if (!r.ok) throw 0; bytes = await r.arrayBuffer(); }
  catch (e) { return {p, why: "its PDF file is missing from the library folder"}; }
  if (p.sha256 && await sha256(bytes) !== p.sha256) return {p, why: "its PDF is not the file that was added (it was changed outside the program). Check it in Settings, Diagnostics, then accept it or replace it"};
  let doc;
  try { doc = await PDFDocument.load(bytes, {ignoreEncryption: true}); }
  catch (e) { return {p, why: "its PDF is damaged and cannot be read"}; }
  if (doc.isEncrypted) return {p, why: "its PDF is password-protected, so it cannot be combined into a book. Print it on its own from its product page"};
  let n = 0; try { n = doc.getPageCount(); } catch (e) {}
  if (!n) return {p, why: "its PDF has no readable pages"};
  return {p, doc, n};
}

// stampFooter writes a small binder page number in the bottom right corner of
// a page as it will be seen, whatever the page's size or rotation. Nothing is
// painted behind it, so it can never cover the manufacturer's text.
function stampFooter(pg, text, font) {
  const size = 7.5, tw = font.widthOfTextAtSize(text, size), box = pg.getCropBox();
  const rot = ((pg.getRotation().angle % 360) + 360) % 360;
  const seenWidth = rot % 180 ? box.height : box.width, vx = seenWidth - tw - 20, vy = 9;
  const at = rot === 90 ? [box.x + box.width - vy, box.y + vx] : rot === 180 ? [box.x + box.width - vx, box.y + box.height - vy]
    : rot === 270 ? [box.x + vy, box.y + box.height - vx] : [box.x + vx, box.y + vy];
  pg.drawText(text, {x: at[0], y: at[1], size, font, color: GREY, rotate: degrees(rot)});
}

// buildBook assembles the PDF. It first opens every sheet, so that it knows the
// true page counts and any sheet that cannot be included before a single page
// is drawn. A book with a sheet left out is stamped INCOMPLETE on its cover and index.
async function buildBook(opt, progress = () => {}) {
  const items = opt.items, W = PAGE_W, H = PAGE_H, today = longDate();
  const loaded = [];
  for (const [i, p] of items.entries()) { progress(`Checking sheet ${i + 1} of ${items.length}...`); loaded.push(await loadSheet(p)); }
  const good = loaded.filter(x => x.doc), problems = loaded.filter(x => !x.doc).map(x => ({name: x.p.name, why: x.why}));
  const complete = problems.length === 0;

  // Work out where everything lands before drawing, so the index can cite real page numbers.
  let page = 0; const starts = {}, dividerBefore = new Set();
  if (opt.cover) page++;
  if (opt.index) page += indexPageCount(items.length);
  let last = null;
  for (const x of good) {
    if (opt.dividers && x.p.category !== last) { last = x.p.category; dividerBefore.add(x.p.id); page++; }
    starts[x.p.id] = page + 1; page += x.n;
  }
  const total = page;

  const out = await PDFDocument.create();
  const F = {r: await out.embedFont(StandardFonts.Helvetica), b: await out.embedFont(StandardFonts.HelveticaBold), t: await out.embedFont(StandardFonts.TimesRomanBold)};
  const ink = opt.eco ? WINE : rgb(1, 1, 1);
  const bar = (pg, x, y, w, h) => pg.drawRectangle(opt.eco ? {x, y, width: w, height: h, borderColor: WINE, borderWidth: 1.5} : {x, y, width: w, height: h, color: WINE});
  const logo = await out.embedPng(await (await fetch("logo.png")).arrayBuffer());
  out.setTitle((complete ? "" : "INCOMPLETE - ") + "Muriale's SDS Book - " + today); out.setAuthor("Muriale's Italian Kitchen");
  // Binder page numbers go in a strip of their own at the foot of the page.
  const footer = (pg, n, band) => { const t = `Binder page ${n} of ${total}`, size = 7.5;
    pg.drawText(t, {x: (pg.getWidth() - F.r.widthOfTextAtSize(t, size)) / 2, y: Math.max(2, band / 2 - 2.5), size, font: F.r, color: GREY}); };
  const numberGenerated = pg => { if (opt.numbers && !opt.indexOnly) footer(pg, out.getPageCount(), 30); };
  const warn = pg => { if (!complete) { pg.drawRectangle({x: 36, y: H - 30, width: W - 72, height: 20, color: RED});
    centre(pg, `INCOMPLETE - ${problems.length} SDS sheet${problems.length === 1 ? " is" : "s are"} missing from this book`, F.b, 11, H - 24, rgb(1, 1, 1)); } };

  if (opt.cover && !opt.indexOnly) {
    const pg = out.addPage([W, H]);
    pg.drawRectangle({x: 30, y: 30, width: W - 60, height: H - 60, borderColor: GOLD, borderWidth: 2.5});
    pg.drawRectangle({x: 38, y: 38, width: W - 76, height: H - 76, borderColor: GOLD, borderWidth: 0.8});
    const lw = 400, lh = lw * logo.height / logo.width;
    pg.drawImage(logo, {x: (W - lw) / 2, y: 470, width: lw, height: lh});
    bar(pg, 38, 358, W - 76, 70);
    centre(pg, "SAFETY DATA SHEETS", F.t, 38, 380, ink);
    centre(pg, "Printed: " + today, F.b, 15, 318);
    centre(pg, good.length + " product" + (good.length === 1 ? "" : "s") + " in this book", F.r, 12, 296, GREY);
    centre(pg, "Emergency: 911     Poison Control: 1-800-222-1222", F.b, 14, 96, WINE);
    if (!complete) { pg.drawRectangle({x: 38, y: 200, width: W - 76, height: 56, color: RED});
      centre(pg, "INCOMPLETE BOOK", F.b, 22, 232, rgb(1, 1, 1)); centre(pg, `${problems.length} SDS sheet${problems.length === 1 ? " is" : "s are"} missing. See the index.`, F.b, 12, 210, rgb(1, 1, 1)); }
  }

  if (opt.index) {
    const paged = true; // the index always says which page each SDS starts on
    const fixed = [["Manufacturer", 96], ["Category", 84], ["Storage Location", 84], ["SDS Date", 54]];
    const cols = [["Product Name", 168], ...fixed, ["Page", 54]];
    const X = 36, RH = IDX.row;
    let pg, y, n = 0;
    const head = first => {
      pg = out.addPage([W, H]); warn(pg); numberGenerated(pg);
      if (first) {
        const lw = 128, lh = lw * logo.height / logo.width;
        pg.drawImage(logo, {x: X, y: H - 40 - lh, width: lw, height: lh});
        pg.drawText("Muriale's SDS Book Index", {x: 184, y: H - 74, size: 22, font: F.t, color: INK});
        pg.drawText("Page numbers count every page of the book, starting at 1.", {x: 184, y: H - 92, size: 8, font: F.r, color: GREY});
        for (const [i, t] of ["Safety Data Sheets Index", "Printed: " + today].entries())
          pg.drawText(t, {x: W - X - F.r.widthOfTextAtSize(t, 9), y: H - 56 - i * 12, size: 9, font: F.r, color: INK});
        y = IDX.firstTop;
      } else y = IDX.nextTop;
      bar(pg, X, y - 5, W - 2 * X, RH);
      let x = X;
      for (const [label, w] of cols) { pg.drawText(label, {x: x + 4, y, size: 9, font: F.b, color: ink}); x += w; }
      y -= RH;
    };
    head(true);
    for (const p of items) {
      if (y < IDX.bottom) head(false);
      n++;
      const gone = !starts[p.id];
      if (n % 2 === 0 && !opt.eco) pg.drawRectangle({x: X, y: y - 5, width: W - 2 * X, height: RH, color: rgb(0.95, 0.94, 0.91)});
      pg.drawLine({start: {x: X, y: y - 5}, end: {x: W - X, y: y - 5}, thickness: 0.4, color: rgb(0.7, 0.7, 0.7)});
      const cells = [p.name, p.manufacturer, p.category, p.location, sdsDate(p)];
      if (paged) cells.push(gone ? "MISSING" : String(starts[p.id])); else cells.unshift(String(n));
      let x = X;
      for (const [i, v] of cells.entries()) {
        const lastCol = paged && i === cells.length - 1;
        pg.drawText(fit(v, lastCol ? F.b : F.r, lastCol && gone ? 7 : 9, cols[i][1] - 7), {x: x + 4, y, size: lastCol && gone ? 7 : 9, font: lastCol ? F.b : F.r, color: gone ? RED : INK}); x += cols[i][1];
      }
      y -= RH;
    }
  }

  if (!opt.indexOnly) {
    let done = 0;
    for (const x of good) {
      progress(`Adding sheet ${++done} of ${good.length}...`);
      if (dividerBefore.has(x.p.id)) {
        const pg = out.addPage([W, H]), count = good.filter(q => q.p.category === x.p.category).length;
        numberGenerated(pg);
        bar(pg, 0, 500, W, 84);
        centre(pg, fit(x.p.category || state.lib.catchAll, F.t, 38, W - 80), F.t, 38, 530, ink);
        centre(pg, count + " product" + (count === 1 ? "" : "s"), F.b, 13, 468, GREY);
        centre(pg, clean(CAT_HELP[x.p.category] || ""), F.r, 11, 446, GREY);
      }
      const idxs = x.doc.getPageIndices();
      if (!opt.numbers) { (await out.copyPages(x.doc, idxs)).forEach(c => out.addPage(c)); continue; }
      // Upright pages are shrunk about 3% into the upper part of a page of the same size, so the
      // number can never cover anything printed on the manufacturer's page. Pages that are
      // rotated keep their own geometry and get a small number in the corner instead.
      const upright = idxs.filter(i => rotOf(x.doc.getPage(i)) === 0), turned = idxs.filter(i => !upright.includes(i));
      const boxes = upright.map(i => { const b = x.doc.getPage(i).getCropBox(); return {left: b.x, bottom: b.y, right: b.x + b.width, top: b.y + b.height}; });
      const emb = upright.length ? await out.embedPages(upright.map(i => x.doc.getPage(i)), boxes) : [];
      const copies = turned.length ? await out.copyPages(x.doc, turned) : [];
      for (const i of idxs) {
        const u = upright.indexOf(i);
        if (u < 0) { const pg = out.addPage(copies[turned.indexOf(i)]); try { stampFooter(pg, `Binder page ${out.getPageCount()} of ${total}`, F.r); } catch (e) {} continue; }
        const b = boxes[u], w = b.right - b.left, h = b.top - b.bottom, band = Math.min(BAND, h * 0.08), s = (h - band) / h;
        const np = out.addPage([w, h]);
        np.drawPage(emb[u], {x: (w - w * s) / 2, y: band, width: w * s, height: h * s});
        footer(np, out.getPageCount(), band);
      }
    }
    if (out.getPageCount() !== total) throw new Error("The book did not come out at the expected length. Nothing was printed; please try again.");
  }
  return {bytes: await out.save(), pages: out.getPageCount(), bookPages: total, problems, complete, starts, included: good.length};
}

let pv = {url: null, name: "", blob: false};
function showPreview(url, blob, name, title, note) {
  if (pv.url && pv.blob) URL.revokeObjectURL(pv.url);
  pv = {url, name, blob};
  $("#pvTitle").textContent = title; $("#pvNote").textContent = note;
  $("#pvFrame").src = url; $("#preview").className = "show";
}
let pendingBook = null;
function openBook(book) {
  const o = printOpt, idxOnly = o.scope === "index";
  const url = URL.createObjectURL(new Blob([book.bytes], {type: "application/pdf"}));
  const stamp = new Date().toISOString().slice(0, 10), pages = `${book.pages} page${book.pages === 1 ? "" : "s"}, confirmed`;
  if (idxOnly) return showPreview(url, true, `Muriales SDS Index ${stamp}.pdf`, `SDS Index — ${pages}`, "Check the pages, then click Print.");
  showPreview(url, true, `${book.complete ? "" : "INCOMPLETE "}Muriales SDS Book ${stamp}.pdf`,
    book.complete ? `SDS Book — ${pages}` : `INCOMPLETE SDS BOOK — ${book.problems.length} sheet${book.problems.length === 1 ? "" : "s"} left out — ${pages}`,
    book.complete ? "After the pages are in the binder, click “Binder Is Up to Date” on the Library screen." : "This is not a complete binder. Do not record the binder as up to date from this printout.");
}
async function runPrint() {
  const o = printOpt, items = printItems(), idxOnly = o.scope === "index";
  const busy = $("#busy"); const say = t => { if (busy) busy.textContent = t; };
  say("Preparing the pages...");
  const book = await buildBook({items, cover: o.cover, index: idxOnly || o.index, dividers: o.dividers, numbers: o.numbers, eco: o.eco, indexOnly: idxOnly}, say);
  api("/api/binder/generated", {method: "POST", body: JSON.stringify({scope: o.scope, pages: book.pages, complete: book.complete, missing: book.problems.map(x => x.name), ids: items.map(p => p.id)})})
    .then(reload).then(() => { if (state.view === "library") render(); }).catch(() => {});
  if (book.complete) { closeModal(); return openBook(book); }
  // A sheet could not be included. Stop and say so; nothing reaches the printer unless the manager chooses to go on.
  pendingBook = book;
  showModal(`<h2>${icon("warn")}This ${idxOnly ? "Index" : "Book"} Is Incomplete</h2><div class="body">
    <p style="margin-top:0"><b>${book.problems.length} of ${items.length} SDS sheets could not be included.</b> A binder printed now would be missing ${book.problems.length === 1 ? "it" : "them"}.</p>
    <div class="box" style="max-height:210px;overflow:auto">${book.problems.map(x => `<p style="margin:4px 0"><b>${esc(x.name)}:</b> ${esc(x.why)}.</p>`).join("")}</div>
    <p>Fix ${book.problems.length === 1 ? "this sheet" : "these sheets"} in Settings (Diagnostics to check files, Clean Up to replace), then print again. If you go on, every copy is stamped INCOMPLETE.</p></div>
    <div class="foot"><button class="btn green big" data-act="fix-sheets">Fix the Sheets</button><button class="btn big" data-act="open-incomplete">Preview Incomplete Copy</button><button class="btn big" data-act="close">Cancel</button></div>`);
}
// "2-4, 7" -> [1,2,3,6] (zero-based), or null if it is not a valid list for a PDF of n pages.
function parsePages(text, n) {
  const out = [];
  for (const part of text.split(",").map(s => s.trim()).filter(Boolean)) {
    const m = /^(\d+)(?:\s*-\s*(\d+))?$/.exec(part); if (!m) return null;
    const a = +m[1], b = m[2] ? +m[2] : a; if (a < 1 || b < a || b > n) return null;
    for (let i = a; i <= b; i++) out.push(i - 1);
  }
  return out.length ? out : null;
}
async function printOne() {
  const p = byId(state.id), all = $('input[name="pp"]:checked').value === "all", stamp = new Date().toISOString().slice(0, 10);
  if (all) { closeModal(); return showPreview(`/pdf/${p.id}?v=${encodeURIComponent(p.pdfUpdatedAt || "")}`, false, `${p.name} SDS.pdf`, `${p.name} — complete SDS`, "This is the manufacturer's sheet exactly as supplied."); }
  const x = await loadSheet(p); if (!x.doc) throw new Error(`Pages cannot be picked from this sheet because ${x.why}.`);
  const want = parsePages($("#pprange").value, x.n);
  if (!want) throw new Error(`Enter pages between 1 and ${x.n}, for example 2-4 or 1, 3.`);
  const out = await PDFDocument.create(); (await out.copyPages(x.doc, want)).forEach(c => out.addPage(c));
  closeModal();
  showPreview(URL.createObjectURL(new Blob([await out.save()], {type: "application/pdf"})), true, `${p.name} SDS pages ${$("#pprange")?.value || ""} ${stamp}.pdf`.replace(/\s+/g, " "),
    `${p.name} — ${want.length} of ${x.n} pages`, "A reference copy of selected pages. The official binder uses the complete sheet.");
}

/* ---------- form helpers ---------- */
async function takeFile(file) {
  const f = state.form;
  if (!file || !f || (f.id && !f.replaceMode)) return;
  if (!/\.pdf$/i.test(file.name) && file.type !== "application/pdf") return toast("That file is not a PDF.", true);
  f.file = file; f.pages = 0; f.fileNote = "";
  try { f.pages = (await PDFDocument.load(await file.arrayBuffer(), {ignoreEncryption: true})).getPageCount(); f.fileNote = f.pages + " page" + (f.pages === 1 ? "" : "s"); }
  catch (e) { f.fileNote = "Page count could not be read"; }
  if (!f.id && !f.name.trim()) { f.name = file.name.replace(/\.pdf$/i, "").replace(/[_-]+/g, " ").replace(/\s*\b(sds|msds)\b\s*/ig, " ").trim(); f.nameFromFile = true; }
  f.extract = {kind: "busy"}; render();
  // Read the sheet and draft the details. This happens for both Browse and drag-and-drop.
  try {
    const fd = new FormData(); fd.append("pdf", file);
    const d = await api("/api/extract", {method: "POST", body: fd});
    if (state.form === f && f.file === file) mergeDraft(f, d, false);
  } catch (e) { if (state.form === f) f.extract = {kind: "warn", msg: "The details could not be read from this PDF automatically. Type them from the sheet."}; }
  if (state.form === f) render();
}
// Fills the form from a drafted summary. Only empty fields are filled unless overwrite is set,
// so nothing a manager typed is lost. A draft is never counted as verified.
const DRAFT_KEYS = ["manufacturer", "signalWord", "hazards", "firstAidEyes", "firstAidSkin", "firstAidInhalation", "firstAidSwallowed", "ppe"];
function mergeDraft(f, d, overwrite) {
  if (d.unreadable) { f.extract = {kind: "warn", msg: d.unreadable}; return; }
  const set = (k, v) => { if (v && (overwrite || !String(f[k] || "").trim())) f[k] = v; };
  if (!f.id && d.name && (!f.name.trim() || f.nameFromFile)) { f.name = d.name; f.nameFromFile = false; }
  DRAFT_KEYS.forEach(k => set(k, d[k]));
  if (d.revisionDate && (overwrite || f.replaceMode || !f.revisionDate)) f.revisionDate = d.revisionDate;
  if ((d.pictograms || []).length && (overwrite || !f.pictograms.length)) f.pictograms = [...d.pictograms];
  f.verify = false;
  f.extract = {kind: "ok", found: d.found || [], missing: d.missing || [], notes: d.notes || [], draft: d};
}
function extractBox(f) {
  const x = f.extract, stored = f.id && !f.replaceMode;
  let box = "";
  if (x && x.kind === "busy") box = `<div class="note warn" style="margin-bottom:10px">Reading the PDF to draft the details...</div>`;
  else if (x && x.kind === "warn") box = `<div class="note warn" style="margin-bottom:10px"><span class="grow">${esc(x.msg)}</span></div>`;
  else if (x && x.kind === "ok") box = `<div class="note ok" style="margin-bottom:10px"><span class="grow"><b>Drafted from the PDF.</b> Check every line against the sheet before ticking “verified” below.${x.missing.length ? ` <b>Not found:</b> ${esc(x.missing.join(", "))}.` : ""}${x.notes.map(n => " " + esc(n)).join("")}</span>
    ${f.replaceMode ? `<button class="btn small" data-act="extract-overwrite">Replace Summary With This Sheet's Draft</button>` : ""}</div>`;
  if (stored) box += `<div class="row" style="margin:0 0 10px"><button class="btn small" data-act="extract-stored">${icon("search")}Fill Empty Fields From the PDF</button><span class="hint">Reads the stored sheet. Anything already typed is left alone.</span></div>`;
  return box;
}
async function saveForm() {
  const f = state.form;
  if (!f.name.trim()) return toast("Enter the product name.", true);
  if ((!f.id || f.replaceMode) && !f.file) return toast(f.replaceMode ? "Choose the new PDF first." : "Choose the SDS PDF for this product.", true);
  if (f.verify && !f.verifiedBy.trim()) return toast("Enter who checked the summary.", true);
  if (f.verify) remembered("by", f.verifiedBy.trim());
  const {file, fileNote, id, replaceMode, extract, nameFromFile, ...meta} = f;
  const fd = new FormData(); fd.append("meta", JSON.stringify(meta)); if (file) fd.append("pdf", file);
  const p = await api(id ? "/api/products/" + id : "/api/products", {method: "POST", body: fd});
  await reload(); state.form = null; state.view = "detail"; state.id = p.id; render(); backfillPages();
  toast(replaceMode ? "PDF replaced. The old one is in the removed folder." : id ? "Changes saved." : "SDS added to the library.");
}

const ACT = {
  nav(el) { const v = el.dataset.v; if (v === "print") return state.lib.products.length ? printDialog("all") : toast("Add a product first."); if (v === "add") state.form = blankForm(); state.view = v; if (v === "settings") loadTab(); state.focusQ = false; render(); if (v === "library") return reload().then(render); },
  open(el, e) { if (e.target.closest("input")) return; state.view = "detail"; state.id = el.dataset.id; render(); },
  toggle(el) { state.sel.has(el.dataset.id) ? state.sel.delete(el.dataset.id) : state.sel.add(el.dataset.id); render(); },
  selall() { visible().forEach(p => state.sel.add(p.id)); render(); },
  "selall-box"(el) { visible().forEach(p => el.checked ? state.sel.add(p.id) : state.sel.delete(p.id)); render(); },
  clear() { state.sel.clear(); render(); },
  sort(el) { const k = el.dataset.k; state.sort = {key: k, dir: state.sort.key === k ? -state.sort.dir : 1}; render(); },
  print(el) { printDialog(el.dataset.scope); },
  "print-go"(el) { el.disabled = true; return runPrint(); },
  "print-one"() { const p = byId(state.id);
    showModal(`<h2>${icon("print")}Print This Sheet</h2><div class="body"><p style="margin-top:0"><b>${esc(p.name)}</b>${p.pages ? ` — ${p.pages} pages` : ""}</p>
      <label><input type="radio" name="pp" value="all" checked>The complete SDS (use this for the binder)</label>
      <label><input type="radio" name="pp" value="some">Only these pages: <input id="pprange" class="field" style="width:150px" placeholder="e.g. 2-4, 7"></label>
      <p class="hint" style="color:#444">Picking pages makes a separate reference copy. The stored SDS is not changed.</p></div>
      <div class="foot"><button class="btn green big" data-act="print-one-go">${icon("print")}Preview &amp; Print</button><button class="btn big" data-act="close">Cancel</button></div>`); },
  "print-one-go": printOne,
  "fix-sheets"() { closeModal(); pendingBook = null; state.view = "settings"; state.tab = "diagnostics"; render(); loadTab(); },
  "open-incomplete"() { const b = pendingBook; pendingBook = null; closeModal(); if (b) openBook(b); },
  edit() { const p = byId(state.id); state.form = {...blankForm(), ...p, pictograms: p.pictograms || []}; state.view = "add"; render(); },
  replace(el) { const p = byId(el.dataset.id); state.form = {...blankForm(), ...p, pictograms: p.pictograms || [], replaceMode: true}; state.view = "add"; render(); },
  remove(el) { state.id = el.dataset.id; removeDialog(byId(state.id)); },
  async "remove-yes"() { const p = byId(state.id); await api("/api/products/" + state.id, {method: "DELETE"}); closeModal(); await reload(); render(); toast(`“${p.name}” was removed. It can be restored from Settings, Clean Up for 30 days.`); },
  async "refresh-folder"() { const had = new Set(state.lib.products.map(p => p.id)), gone = state.lib.products.filter(p => p.missing).length;
    await reload(); render();
    const added = state.lib.products.filter(p => !had.has(p.id)), nowGone = state.lib.products.filter(p => p.missing).length;
    toast(added.length ? `Added ${added.length} new sheet${added.length === 1 ? "" : "s"}: ${added.slice(0, 3).map(p => p.name).join(", ")}${added.length > 3 ? "..." : ""}. Check the details and edit if needed.`
      : nowGone !== gone ? "Refreshed. The PDF-missing flags were updated." : "Refreshed. No new PDFs in the folder."); },
  "purge-ask"(el) { const p = (state.lib.removed || []).find(x => x.id === el.dataset.id) || {name: "this product"};
    showModal(`<h2>${icon("trash")}Delete Permanently</h2><div class="body"><p>Delete <b>${esc(p.name)}</b> and its PDF for good? This cannot be undone.</p></div>
    <div class="foot"><button class="btn wine big" data-act="purge-go" data-id="${el.dataset.id}">${icon("trash")}Delete Permanently</button><button class="btn big" data-act="close">Cancel</button></div>`); },
  async "purge-go"(el) { el.disabled = true; await api("/api/removed/" + el.dataset.id, {method: "DELETE"}); closeModal(); await reload(); render(); toast("Deleted permanently."); },
  async "restore-product"(el) { const p = await api("/api/removed/" + el.dataset.id + "/restore", {method: "POST"}); await reload(); render(); toast(`“${p.name}” is back in the library.`); },
  "handoff-view"() { window.open("/api/handoff/report?print=1", "_blank"); },
  "handoff-email"() { let last = ""; try { last = localStorage.getItem("sds.handoffTo") || ""; } catch (e) {}
    showModal(`<h2>${icon("up")}Email Manager Handoff</h2><div class="body"><div class="fields">
      <label>To: <span class="req">*</span></label><input class="field" id="hoto" value="${esc(last)}" placeholder="manager@example.com; another@example.com">
      <label>Subject:</label><input class="field" id="hosub" placeholder="Manager Handoff">
      <label>Message:</label><textarea class="field" rows="4" id="homsg" placeholder="Optional note to go above the report"></textarea></div>
      <p class="hint">This opens a new message in Outlook with the handoff attached as a PDF (or a web page if a PDF could not be made). Check it, then press Send in Outlook.</p></div>
      <div class="foot"><button class="btn green big" data-act="handoff-email-go">${icon("up")}Open in Outlook</button><button class="btn big" data-act="close">Cancel</button></div>`); },
  async "handoff-email-go"() { const to = $("#hoto").value; if (!to.trim()) return toast("Enter who to send it to.", true);
    try { localStorage.setItem("sds.handoffTo", to); } catch (e) {}
    try { const o = await api("/api/handoff/email", {method: "POST", body: JSON.stringify({to, subject: $("#hosub").value, message: $("#homsg").value})}); closeModal(); emailResult(o, "handoff"); } catch (e) { toast(e.message, true); } },
  "view-removed"(el) { window.open("/pdf-removed/" + el.dataset.id, "_blank"); },
  tab(el) { state.tab = el.dataset.t; render(); loadTab(); },
  "binder-mark"() { const lb = state.lib.lastBuild;
    if (!lb || !lb.complete || lb.confirmed) return toast("Print a complete book first. Only a complete book can be confirmed.", true);
    const n = Object.keys(lb.items || {}).length, what = lb.scope === "all" ? "entire book" : lb.scope === "index" ? "index" : "selected sheets";
    showModal(`<h2>${icon("list")}Confirm the Paper Binder</h2><div class="body">
      <p style="margin-top:0">Record that the printed ${what} is now in the paper binder?</p>
      <div class="box">Assembled ${fmtDate(lb.at)} at ${esc(lb.at.slice(11, 16))}: ${n} product${n === 1 ? "" : "s"}, ${lb.pages} pages, complete.
        ${lb.scope === "selected" ? "<br>Only these sheets are recorded as updated." : lb.scope === "index" ? "<br>Only the index is recorded as reprinted." : ""}</div>
      <p>Only confirm once the printed pages are actually in the binder. Assembling or previewing a book does not count.</p></div>
      <div class="foot"><button class="btn green big" data-act="binder-mark-go">Yes, It Is in the Binder</button><button class="btn big" data-act="close">Not Yet</button></div>`); },
  async "binder-mark-go"() { await api("/api/binder/confirm", {method: "POST"}); closeModal(); await reload(); render(); toast("Recorded: the paper binder was updated."); },
  async "binder-pulled"() { await api("/api/binder/pulled", {method: "POST"}); await reload(); render(); toast("Recorded: those sheets were taken out of the binder."); },
  "binder-select"() { const d = binderDiff(); state.sel = new Set([...d.add, ...d.replace].map(p => p.id)); state.q = ""; state.cat = ""; render(); toast("Changed sheets selected. Click Print Selected."); },
  async "restore-ask"(el) { const file = el.dataset.file, i = await api("/api/backups/inspect", {method: "POST", body: JSON.stringify({file})});
    showModal(`<h2>${icon("swap")}Restore From Backup</h2><div class="body">
      <p style="margin-top:0">Replace the current library with this backup?</p>
      <div class="box"><dl><dt>Backup:</dt><dd>${esc(file)}</dd><dt>Contains:</dt><dd>${i.products} product${i.products === 1 ? "" : "s"}, ${i.sheets} PDF${i.sheets === 1 ? "" : "s"}${i.removed ? `, ${i.removed} removed` : ""}</dd><dt>Library now:</dt><dd>${state.lib.products.length} product${state.lib.products.length === 1 ? "" : "s"}</dd></dl></div>
      ${i.missingPdfs.length ? `<p><b>Note:</b> the backup has no PDF for: ${esc(i.missingPdfs.join(", "))}.</p>` : ""}
      <p>The current library is not deleted. It is moved into a “Before restore” folder inside SDS Backups. If the backup does not open correctly, the current library is put back.</p></div>
      <div class="foot"><button class="btn wine big" data-act="restore-go" data-file="${esc(file)}">Restore This Backup</button><button class="btn big" data-act="close">Cancel</button></div>`); },
  async "restore-go"(el) { el.disabled = true; const r = await api("/api/restore", {method: "POST", body: JSON.stringify({file: el.dataset.file})}); closeModal(); state.sel.clear(); await reload(); await loadBackups(); toast(`Backup restored: ${r.products} products. The previous library is in ${r.previousKeptIn}`); },
  "open-backups"() { return api("/api/open-folder?which=backups", {method: "POST"}); },
  "folder-ask"() { showModal(`<h2>${icon("folder")}Change Library Location</h2><div class="body">
      <p style="margin-top:0">Paste the full path of the folder to keep the library in. For Microsoft 365, use the OneDrive or SharePoint folder that is synced to this computer, or a mapped network drive.</p>
      <input id="newfolder" class="field" placeholder="e.g. C:\\Users\\Office\\OneDrive - Muriale's\\SDS Data">
      <p class="hint" style="color:#444">Tip: open the folder in File Explorer, click the address bar, copy, and paste it here.</p>
      <p>If the folder is empty, the current library is copied into it. If it already holds an SDS library, that library is opened instead. The current folder is left where it is.</p></div>
      <div class="foot"><button class="btn green big" data-act="folder-go">Use This Folder</button><button class="btn big" data-act="close">Cancel</button></div>`); $("#newfolder").focus(); },
  async "folder-go"(el) { const path = $("#newfolder").value; if (!path.trim()) return toast("Paste the folder path first.", true); el.disabled = true;
    try { const r = await api("/api/data-folder", {method: "POST", body: JSON.stringify({path})}); closeModal(); state.sel.clear(); await reload(); await loadBackups(); toast(r.copied ? `Library copied to ${r.folder}. The old copy is still in ${r.previous}` : `Now using the library already in ${r.folder} (${r.products} products).`); }
    finally { el.disabled = false; } },
  async emerg() { const p = byId(state.id), bytes = await emergencySheet(p), stamp = new Date().toISOString().slice(0, 10);
    showPreview(URL.createObjectURL(new Blob([bytes], {type: "application/pdf"})), true, `${p.name} Emergency Sheet ${stamp}.pdf`, `Emergency Sheet — ${p.name}`, "One page. Check it, then click Print."); },
  async "extract-stored"(el) { const f = state.form; el.disabled = true;
    try { mergeDraft(f, await api(`/api/products/${f.id}/extract`, {method: "POST"}), false); } finally { render(); } },
  "extract-overwrite"() { const f = state.form; if (f.extract && f.extract.draft) { mergeDraft(f, f.extract.draft, true); render(); toast("Summary replaced with the draft from the new sheet. Check it, then verify."); } },
  "area-add"() { const v = $("#newarea").value.trim(); if (!v) return toast("Type the name of the area first.", true);
    if ((state.lib.locations || []).some(x => x.toLowerCase() === v.toLowerCase())) return toast("That area is already in the list.", true);
    return saveAreas([...(state.lib.locations || []), v]).then(() => toast(`“${v}” added.`)); },
  "area-adopt"(el) { return saveAreas([...(state.lib.locations || []), el.dataset.name]); },
  "area-remove"(el) { const l = [...state.lib.locations], [gone] = l.splice(+el.dataset.i, 1); return saveAreas(l).then(() => toast(`“${gone}” removed.`)); },
  "area-rename"(el) { const old = state.lib.locations[+el.dataset.i], n = state.lib.products.filter(p => (p.location || "").trim().toLowerCase() === old.toLowerCase()).length;
    showModal(`<h2>${icon("edit")}Rename Storage Area</h2><div class="body"><input id="renamearea" class="field" value="${esc(old)}" maxlength="60" data-old="${esc(old)}">${n ? `<p class="hint" style="color:#444">${n} product${n === 1 ? "" : "s"} stored here will move to the new name.</p>` : ""}</div>
      <div class="foot"><button class="btn green big" data-act="area-rename-go">Save</button><button class="btn big" data-act="close">Cancel</button></div>`); $("#renamearea").select(); },
  "area-rename-go"() { const el = $("#renamearea"), old = el.dataset.old, v = el.value.trim(); if (!v || v === old) return closeModal();
    if (state.lib.locations.some(x => x !== old && x.toLowerCase() === v.toLowerCase())) return toast("That area is already in the list.", true);
    closeModal(); return saveAreas(state.lib.locations.map(x => x === old ? v : x), {[old]: v}).then(() => toast("Renamed.")); },
  "open-product"(el) { state.view = "detail"; state.id = el.dataset.id; render(); },
  async "note-add"() { const text = $("#notetext").value.trim(), by = $("#noteby").value.trim(); if (!text) return toast("Write the note first.", true);
    if (by) remembered("by", by); await api("/api/notes", {method: "POST", body: JSON.stringify({by, text})}); await reload(); render(); toast("Note added."); },
  async "note-done"(el) { await api(`/api/notes/${el.dataset.id}/done`, {method: "POST", body: JSON.stringify({by: remembered("by")})}); await reload(); render(); },
  async "note-reopen"(el) { await api(`/api/notes/${el.dataset.id}/reopen`, {method: "POST", body: "{}"}); await reload(); render(); },
  async "lock-acquire"() { await api("/api/lock/acquire", {method: "POST"}); await reload(); await refreshLock(); render(); toast("You can now make changes."); },
  "lock-takeover-ask"() { const h = state.lock && state.lock.holder;
    showModal(`<h2>${icon("warn")}Take Over Editing</h2><div class="body"><p style="margin-top:0">${h ? esc(h.who) + " is" : "Someone else is"} editing${h && h.live ? " right now" : ""}. If you take over, they can no longer make changes and anything they have not saved is lost.</p>
      <p>Only do this if you are sure they have finished, for example if that computer was turned off or crashed.</p></div>
      <div class="foot"><button class="btn wine big" data-act="lock-takeover">Take Over</button><button class="btn big" data-act="close">Cancel</button></div>`); },
  async "lock-takeover"() { await api("/api/lock/takeover", {method: "POST"}); closeModal(); await reload(); await refreshLock(); render(); toast("You are now the editor."); },
  async "integ-accept"(el) { await api(`/api/integrity/${el.dataset.id}/accept`, {method: "POST"}); await reload(); if (state.integ) state.integ = (await api("/api/integrity?full=1")).rows; render(); toast("File accepted. The binder will show this sheet as needing a reprint."); },
  async "integ-run"(el) { el.disabled = true; try { state.integ = (await api("/api/integrity?full=1")).rows; } finally { el.disabled = false; } render(); },
  async "diag-run"() { state.diag = null; render(); await loadDiag(); },
  "diag-save"() { const a = document.createElement("a"), b = new Blob([state.diag.report], {type: "text/plain"}); a.href = URL.createObjectURL(b); a.download = `SDS Manager diagnostics ${new Date().toISOString().slice(0, 10)}.txt`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); },
  async "diag-copy"() { try { await navigator.clipboard.writeText(state.diag.report); toast("Report copied."); } catch (e) { toast("Could not copy. Use Save Report instead.", true); } },
  "import-pdfs"() { $("#importpdfs").click(); },
  "import-zip"() { $("#importzip").click(); },
  "rec-prev"() { showModal(`<h2>${icon("warn")}Go Back One Save</h2><div class="body"><p style="margin-top:0">Replace the product list with the version from before the last save?</p><p>Changes made in the last save will be undone. The current list is kept as a copy beside it.</p></div>
      <div class="foot"><button class="btn wine big" data-act="rec-prev-go">Go Back</button><button class="btn big" data-act="close">Cancel</button></div>`); },
  async "rec-prev-go"(el) { el.disabled = true; const r = await api("/api/recovery/previous-save", {method: "POST"}); closeModal(); await reload(); await loadRecovery(); toast(`Went back one save: ${r.products} products. The list it replaced is kept as ${r.keptAs}.`); },
  "rec-rebuild"() { showModal(`<h2>${icon("warn")}Rebuild Library</h2><div class="body"><p style="margin-top:0">Set the current product list aside and build a new one from the PDFs in the “sheets” folder?</p><p>Details such as manufacturer, category and emergency summaries are not in the PDFs, so each product comes back as “needs review”. Only use this if the list is lost or damaged.</p></div>
      <div class="foot"><button class="btn wine big" data-act="rec-rebuild-go">Rebuild</button><button class="btn big" data-act="close">Cancel</button></div>`); },
  async "rec-rebuild-go"(el) { el.disabled = true; const r = await api("/api/recovery/rebuild", {method: "POST"}); closeModal(); await reload(); await loadRecovery(); toast(`Library rebuilt: ${r.products} products need review. The old list is kept as ${r.keptAs}.`); },
  async "rec-unlinked"(el) { const p = await api("/api/recovery/unlinked", {method: "POST", body: JSON.stringify({file: el.dataset.file})}); await reload(); await loadRecovery(); toast(`“${p.name}” was added back. Check its details.`); },
  close: closeModal,
  browse(el, e) { if (e.target.id !== "file") $("#file").click(); },
  save: saveForm,
  cancel() { const id = state.form && state.form.id; state.form = null; state.view = id ? "detail" : "library"; render(); },
  "cat-add"() { const v = $("#newcat").value.trim(); if (!v) return; const c = state.lib.categories; if (c.some(x => x.toLowerCase() === v.toLowerCase())) return toast("That category already exists.", true); return saveCats([...c.slice(0, -1), v, state.lib.catchAll]); },
  "cat-move"(el) { const c = [...state.lib.categories], i = +el.dataset.i, j = i + +el.dataset.d; [c[i], c[j]] = [c[j], c[i]]; return saveCats(c); },
  "cat-remove"(el) { const c = [...state.lib.categories], [gone] = c.splice(+el.dataset.i, 1); if (state.cat === gone) state.cat = ""; return saveCats(c); },
  "cat-rename"(el) { const old = state.lib.categories[+el.dataset.i];
    showModal(`<h2>${icon("edit")}Rename Category</h2><div class="body"><input id="rename" class="field" value="${esc(old)}" maxlength="40" data-old="${esc(old)}"></div><div class="foot"><button class="btn green big" data-act="cat-rename-go">Save</button><button class="btn big" data-act="close">Cancel</button></div>`); $("#rename").select(); },
  "cat-rename-go"() { const el = $("#rename"), old = el.dataset.old, v = el.value.trim(); if (!v || v === old) return closeModal(); const c = state.lib.categories; if (c.some(x => x !== old && x.toLowerCase() === v.toLowerCase())) return toast("That category already exists.", true); closeModal(); if (state.cat === old) state.cat = v; return saveCats(c.map(x => x === old ? v : x), {[old]: v}); },
  "open-folder"() { return api("/api/open-folder", {method: "POST"}); },
  async backup() { const r = await api("/api/backup", {method: "POST"}); await loadBackups(); toast("Backup created: " + r.file); },
  "pv-print"() { try { $("#pvFrame").contentWindow.focus(); $("#pvFrame").contentWindow.print(); } catch (e) { toast("Use the printer button in the top right corner of the preview.", true); } },
  "pv-save"() { const a = document.createElement("a"); a.href = pv.url; a.download = pv.name; a.click(); },
  "pv-close"() { $("#preview").className = ""; $("#pvFrame").src = "about:blank"; render(); },
};
$('[data-act="pv-print"]').innerHTML = icon("print") + "Print";
$('[data-act="pv-save"]').innerHTML = icon("down") + "Save as PDF";
$('[data-act="pv-close"]').innerHTML = icon("x") + "Close";

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const act = e.target.closest("input[data-act]") ? e.target.dataset.act : el.dataset.act;
  const target = e.target.closest("input[data-act]") || el;
  Promise.resolve().then(() => ACT[act](target, e)).catch(err => { toast(err.message || String(err), true); if (act === "print-go") drawPrintDialog(); if (act === "print-one-go") el.disabled = false; });
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { state.q = t.value; state.focusQ = true; render(); }
  else if (t.dataset.f && state.form) { state.form[t.dataset.f] = t.value; if (t.dataset.f === "name") state.form.nameFromFile = false; if (t.dataset.f === "category") $("#cathelp").textContent = CAT_HELP[t.value] || ""; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "cat") { state.cat = t.value; state.focusQ = false; render(); }
  else if (t.id === "file") takeFile(t.files[0]);
  else if (t.id === "importpdfs" && t.files.length) { const files = [...t.files]; t.value = "";
    upload("/api/import/pdfs", "pdf", files).then(async r => { await reload(); const sk = r.skipped || [];
      backfillPages();
      showModal(`<h2>${icon("up")}Import Finished</h2><div class="body"><p style="margin-top:0"><b>${r.added.length} PDF${r.added.length === 1 ? "" : "s"} added</b> and marked “needs review”. The manufacturer, SDS date and emergency summary were drafted from each sheet where they could be read. Open each one to check them and add the category and storage location.</p>
        ${sk.length ? `<p><b>${sk.length} skipped:</b></p><div class="box" style="max-height:180px;overflow:auto">${sk.map(x => `<div>${esc(x.name)} ${esc(x.reason)}</div>`).join("")}</div>` : ""}</div>
        <div class="foot"><button class="btn green big" data-act="close">OK</button></div>`); render(); }).catch(e => toast(e.message, true)); }
  else if (t.id === "importzip" && t.files.length) { const f = t.files[0]; t.value = "";
    upload("/api/import/backup", "zip", [f]).then(async () => { state.tab = "backup"; render(); await loadBackups(); toast("Library zip added to the backups list. Restore it below when you are ready."); }).catch(e => toast(e.message, true)); }
  else if (t.dataset.fc && state.form) state.form[t.dataset.fc] = t.checked;
  else if (t.dataset.pic && state.form) { const s = new Set(state.form.pictograms); t.checked ? s.add(t.dataset.pic) : s.delete(t.dataset.pic); state.form.pictograms = [...s]; }
  else if (t.dataset.f === "revisionDate" && state.form) render();
  else if (t.name === "scope") { printOpt.scope = t.value; drawPrintDialog(); }
  else if (t.id === "pprange") { const some = $('input[name="pp"][value="some"]'); if (some) some.checked = true; }
  else if (t.dataset.o) { printOpt[t.dataset.o] = t.checked; drawPrintDialog(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modal").className) closeModal(); if (e.key === "Enter" && e.target.id === "newcat") ACT["cat-add"](); if (e.key === "Enter" && e.target.id === "rename") ACT["cat-rename-go"](); if (e.key === "Enter" && e.target.id === "newarea") ACT["area-add"](); if (e.key === "Enter" && e.target.id === "renamearea") ACT["area-rename-go"](); });
for (const ev of ["dragover", "dragleave", "drop"]) document.addEventListener(ev, e => {
  if (state.view !== "add") { if (ev !== "dragleave") e.preventDefault(); return; }
  e.preventDefault(); const d = $("#drop"); if (d) d.classList.toggle("over", ev === "dragover");
  if (ev === "drop" && e.dataTransfer.files[0]) takeFile(e.dataTransfer.files[0]);
});

let misses = 0;
setInterval(() => refreshLock().catch(() => {}), 15000);
setInterval(() => fetch("/api/ping").then(r => { if (!r.ok) throw 0; misses = 0; $("#lost").style.display = "none"; }).catch(() => { if (++misses >= 2) $("#lost").style.display = "block"; }), 5000);
fetch("/api/ping");
addEventListener("pagehide", () => { try { fetch("/api/closing", { keepalive: true }); } catch (e) {} });
reload().then(() => { render(); refreshLock().catch(() => {}); backfillPages(); }).catch(e => toast(e.message, true));
</script>
</body>
</html>
